[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchen-chat-mcp"
version = "0.1.0"
description = "Local, serverless messaging between Claude Code sessions (MCP server)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "textual>=0.60",
]

[project.scripts]
kitchen-talk = "kitchen_chat_mcp.ui.server:main"
kitchen-talk-cli = "kitchen_chat_mcp.ui.cli:main"

[tool.setuptools.packages.find]
include = ["kitchen_chat_mcp*"]
